name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # windows-latest ships rustup + the MSVC build tools; just pin stable.
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build release
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v4
        with:
          name: nemotron-bubble
          path: |
            target/release/nemotron-bubble.exe
            scripts/download-nemotron.ps1
