[package]
name = "nemotron-bubble"
version = "0.2.0"
edition = "2024"
description = "Push-to-talk dictation bubble with on-device Nemotron speech recognition"
build = "build.rs"

# The `assets` feature pulls in PNG/GIF encoders only for generating README art via
# `--render-assets`; the shipped app does not depend on them.
[features]
assets = ["dep:png", "dep:gif"]

[build-dependencies]
# Embeds the Windows version resource (see build.rs).
embed-resource = "3.0.12"

[dependencies]
anyhow = "1"
cpal = "0.18"
crossbeam-channel = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
once_cell = "1"
# "directml": optional GPU inference via DirectML (any DirectX 12 GPU), see the
# "Processing" setting. The app falls back to the CPU when no GPU is usable.
parakeet-rs = { version = "0.4.4", features = ["directml"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Model downloads from Hugging Face (Model tab) and their SHA-256 verification.
ureq = "3"
sha2 = "0.11"
winreg = "0.56"
png = { version = "0.17", optional = true }
gif = { version = "0.13", optional = true }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_Media_Audio",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging"
] }
